<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Training Plan</title>
<meta name="theme-color" content="#1A1A1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/SuisseIntl-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Nicholas-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app">
  <header class="top"><div class="wordmark">COMPTRAIN</div></header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections">
  <button class="tab" data-action="tab" data-tab="plan" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>
    Plan
  </button>
  <button class="tab" data-action="tab" data-tab="weights">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 17l5-5 4 4 7-8"/></svg>
    Weights
  </button>
  <button class="tab" data-action="tab" data-tab="more">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
    More
  </button>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<dialog id="sheet" class="sheet"></dialog>
<input id="restore-input" type="file" accept="application/json,.json" hidden>
</body>
</html>
